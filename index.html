<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Más Vida En Tú Dial FM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .player-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 600px;
            background: rgba(25, 25, 35, 0.9);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Reproductor oficial incrustado sin bloqueos -->
        <iframe src="https://masvidaentudial.radio12345.com" allow="autoplay"></iframe>
    </div>

</body>
</html>
